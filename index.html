<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS SecureVault — WASM Engine</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; max-width: 720px; margin: 0 auto; }
        h1 { color: #58a6ff; font-size: 1.6rem; margin-bottom: 0.2rem; }
        .subtitle { font-size: 0.85rem; color: #8b949e; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 1rem; color: #8b949e; }
        input, button, textarea { width: 100%; padding: 0.75rem; margin-top: 0.4rem; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; font-family: monospace; }
        input[type="file"] { font-family: system-ui; cursor: pointer; }
        button { background: #238636; cursor: pointer; font-weight: bold; border: none; margin-top: 0.8rem; font-family: system-ui; transition: background 0.2s; }
        button:hover { background: #2ea043; }
        .btn-decrypt { background: #1f6beb; }
        .btn-decrypt:hover { background: #388bfd; }
        .box { background: #161b22; padding: 1.25rem; border-radius: 8px; border: 1px solid #30363d; margin-top: 1rem; }
        .section-title { font-size: 0.95rem; color: #58a6ff; font-weight: bold; border-bottom: 1px solid #30363d; padding-bottom: 0.5rem; margin-bottom: 0.8rem; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0.8rem; }
    </style>
</head>
<body>
    <h1>BS SecureVault</h1>
    <div class="subtitle">BS OS SE • Client-Side Zero-Knowledge Encryption Engine (WASM)</div>

    <!-- Master Passphrase -->
    <div class="box">
        <label>Master Passphrase (AES-256-GCM + PBKDF2):</label>
        <input type="password" id="passphrase" placeholder="Enter secure passphrase...">
    </div>

    <!-- Section 1: Text Vault -->
    <div class="box">
        <div class="section-title">1. Direct Text & Secret Note Vault</div>
        <label>Text Payload:</label>
        <textarea id="textPayload" rows="3" placeholder="Type or paste confidential text/keys here..."></textarea>
        
        <div class="grid">
            <button id="encryptTextBtn">Encrypt Text</button>
            <button id="decryptTextBtn" class="btn-decrypt">Decrypt Output</button>
        </div>
    </div>

    <!-- Section 2: File Vault -->
    <div class="box">
        <div class="section-title">2. File & Media Vault (.bsv)</div>
        
        <label>Select Any File to Encrypt (Images, PDFs, Videos, Zip):</label>
        <input type="file" id="fileToEncrypt">
        <button id="encryptFileBtn">Encrypt File & Download (.bsv)</button>

        <label style="margin-top: 1.2rem;">Select Encrypted File (.bsv) to Decrypt:</label>
        <input type="file" id="fileToDecrypt">
        <button id="decryptFileBtn" class="btn-decrypt">Decrypt & Restore Original File</button>
    </div>

    <!-- Output Log -->
    <div class="box">
        <div class="section-title">Engine Output Log</div>
        <textarea id="output" rows="6" readonly placeholder="Initializing WASM core..."></textarea>
    </div>

    <script type="module">
        import init, { encrypt_bytes, decrypt_bytes } from './pkg/bs_securevault.js';

        let currentTextCipherBytes = null;

        async function startWasm() {
            await init();
            log("✓ WASM Core Online. Text and binary file engines ready.");

            // --- TEXT ENCRYPTION HANDLER ---
            document.getElementById('encryptTextBtn').addEventListener('click', () => {
                const password = document.getElementById('passphrase').value;
                const text = document.getElementById('textPayload').value;

                if (!password) return log("Error: Passphrase required.");
                if (!text) return log("Error: Please enter text to encrypt.");

                const textBytes = new TextEncoder().encode(text);
                const passBytes = new TextEncoder().encode(password);

                try {
                    const startTime = performance.now();
                    currentTextCipherBytes = encrypt_bytes(textBytes, passBytes);
                    const endTime = performance.now();

                    log(`✓ TEXT ENCRYPTED SUCCESS (${currentTextCipherBytes.length} Bytes | ${(endTime - startTime).toFixed(2)} ms):\n\n${Array.from(currentTextCipherBytes).join(',')}`);
                } catch (e) {
                    log(`Error: ${e}`);
                }
            });

            // --- TEXT DECRYPTION HANDLER ---
            document.getElementById('decryptTextBtn').addEventListener('click', () => {
                const password = document.getElementById('passphrase').value;

                if (!password) return log("Error: Passphrase required.");
                if (!currentTextCipherBytes) return log("Error: Encrypt text first, or choose a .bsv file below for file decryption.");

                const passBytes = new TextEncoder().encode(password);

                try {
                    const startTime = performance.now();
                    const decryptedBytes = decrypt_bytes(currentTextCipherBytes, passBytes);
                    const endTime = performance.now();

                    const decryptedText = new TextDecoder().decode(decryptedBytes);
                    log(`✓ TEXT DECRYPTED SUCCESS (${(endTime - startTime).toFixed(2)} ms):\n\n${decryptedText}`);
                } catch (e) {
                    log(`ACCESS DENIED: ${e}`);
                }
            });

            // --- FILE ENCRYPTION HANDLER ---
            document.getElementById('encryptFileBtn').addEventListener('click', async () => {
                const password = document.getElementById('passphrase').value;
                const fileInput = document.getElementById('fileToEncrypt').files[0];

                if (!password) return log("Error: Passphrase required.");
                if (!fileInput) return log("Error: Select a file to encrypt.");

                log(`Processing file "${fileInput.name}" (${fileInput.size} bytes)...`);

                const arrayBuffer = await fileInput.arrayBuffer();
                const fileBytes = new Uint8Array(arrayBuffer);
                const passBytes = new TextEncoder().encode(password);

                try {
                    const startTime = performance.now();
                    const encryptedBytes = encrypt_bytes(fileBytes, passBytes);
                    const endTime = performance.now();

                    log(`✓ FILE ENCRYPTED SUCCESS!\nFile: ${fileInput.name}\nSize: ${encryptedBytes.length} bytes\nTime: ${(endTime - startTime).toFixed(2)} ms\n\nDownloading package (.bsv)...`);
                    triggerDownload(encryptedBytes, `${fileInput.name}.bsv`, 'application/octet-stream');
                } catch (e) {
                    log(`Error: ${e}`);
                }
            });

            // --- FILE DECRYPTION HANDLER ---
            document.getElementById('decryptFileBtn').addEventListener('click', async () => {
                const password = document.getElementById('passphrase').value;
                const fileInput = document.getElementById('fileToDecrypt').files[0];

                if (!password) return log("Error: Passphrase required.");
                if (!fileInput) return log("Error: Select a .bsv file to decrypt.");

                log(`Decrypting file "${fileInput.name}"...`);

                const arrayBuffer = await fileInput.arrayBuffer();
                const encryptedBytes = new Uint8Array(arrayBuffer);
                const passBytes = new TextEncoder().encode(password);

                try {
                    const startTime = performance.now();
                    const decryptedBytes = decrypt_bytes(encryptedBytes, passBytes);
                    const endTime = performance.now();

                    let originalName = fileInput.name.replace(/\.bsv$/, '');
                    if (originalName === fileInput.name) originalName = "decrypted_file";

                    log(`✓ FILE DECRYPTED SUCCESS!\nRestored Size: ${decryptedBytes.length} bytes\nTime: ${(endTime - startTime).toFixed(2)} ms\n\nDownloading restored file...`);
                    triggerDownload(decryptedBytes, originalName, 'application/octet-stream');
                } catch (e) {
                    log(`ACCESS DENIED: ${e}`);
                }
            });
        }

        function triggerDownload(bytes, filename, mimeType) {
            const blob = new Blob([bytes], { type: mimeType });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = filename;
            link.click();
            URL.revokeObjectURL(link.href);
        }

        function log(msg) {
            document.getElementById('output').value = msg;
        }

        startWasm();
    </script>
</body>
</html>
