<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BS SecureVault — WASM Engine</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; max-width: 650px; margin: 0 auto; }
        h1 { color: #58a6ff; font-size: 1.6rem; margin-bottom: 0.2rem; }
        .subtitle { font-size: 0.85rem; color: #8b949e; margin-bottom: 1.5rem; }
        label { display: block; font-size: 0.85rem; font-weight: 600; margin-top: 1rem; color: #8b949e; }
        input, button, textarea { width: 100%; padding: 0.75rem; margin-top: 0.4rem; background: #161b22; border: 1px solid #30363d; color: #fff; border-radius: 6px; box-sizing: border-box; font-family: monospace; }
        button { background: #238636; cursor: pointer; font-weight: bold; border: none; margin-top: 1rem; font-family: system-ui; }
        button:hover { background: #2ea043; }
        .btn-decrypt { background: #1f6beb; }
        .btn-decrypt:hover { background: #388bfd; }
        .box { background: #161b22; padding: 1.25rem; border-radius: 8px; border: 1px solid #30363d; margin-top: 1rem; }
    </style>
</head>
<body>
    <h1>BS SecureVault</h1>
    <div class="subtitle">BS OS SE • In-Memory Client-Side AES-256-GCM Engine (WASM)</div>

    <div class="box">
        <label>32-Byte Secret Passphrase (256-bit):</label>
        <input type="password" id="key" value="12345678901234567890123456789012">

        <label>Input Payload:</label>
        <textarea id="plaintext" rows="3">Hello from BS OS SE!</textarea>

        <button id="encryptBtn">Encrypt in Rust WASM</button>
        <button id="decryptBtn" class="btn-decrypt">Decrypt in Rust WASM</button>
    </div>

    <div class="box">
        <label>WASM Execution Output:</label>
        <textarea id="output" rows="6" readonly placeholder="Initializing WASM core..."></textarea>
    </div>

    <script type="module">
        import init, { encrypt_bytes, decrypt_bytes } from './pkg/bs_securevault.js';

        let encryptedBytes = null;

        async function startWasm() {
            await init();
            document.getElementById('output').value = "✓ WASM Core Initialized Successfully.";

            document.getElementById('encryptBtn').addEventListener('click', () => {
                const text = new TextEncoder().encode(document.getElementById('plaintext').value);
                const key = new TextEncoder().encode(document.getElementById('key').value);

                try {
                    encryptedBytes = encrypt_bytes(text, key);
                    document.getElementById('output').value = `✓ ENCRYPTED SUCCESS (${encryptedBytes.length} Bytes):\n\n${Array.from(encryptedBytes).join(',')}`;
                } catch (e) {
                    document.getElementById('output').value = `Error: ${e}`;
                }
            });

            document.getElementById('decryptBtn').addEventListener('click', () => {
                if (!encryptedBytes) {
                    document.getElementById('output').value = "Error: Encrypt something first!";
                    return;
                }
                const key = new TextEncoder().encode(document.getElementById('key').value);

                try {
                    const decrypted = decrypt_bytes(encryptedBytes, key);
                    const text = new TextDecoder().decode(decrypted);
                    document.getElementById('output').value = `✓ DECRYPTED SUCCESS:\n\n${text}`;
                } catch (e) {
                    document.getElementById('output').value = `Error: ${e}`;
                }
            });
        }

        startWasm();
    </script>
</body>
</html>
