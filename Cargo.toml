 [package]
 name = "bs-securevault"
 version = "0.1.0"
 edition = "2021"

 [lib]
 crate-type = ["cdylib", "rlib"]

 [[bin]]
 name = "bsv"
 path = "src/bin/bsv.rs"

 [dependencies]
 wasm-bindgen = "0.2"
 aes-gcm = "0.10"
 argon2 = "0.5"
 getrandom = { version = "0.2", features = ["js"] }
 clap = { version = "4.4", features = ["derive"] }
 rpassword = "7.3"
